<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIDElwave Research Solutions — Certificate of Analysis Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#EFEEEA;
    --surface:#FFFFFF;
    --surface-warm:#FBFAF8;
    --surface-soft:#FCFCFB;
    --surface-mute:#F4F3F0;
    --ink:#23272B;
    --ink-2:#5C6469;
    --ink-3:#6E767B;
    --ink-4:#7E888E;
    --mono-mute:#8A9096;
    --placeholder:#9AA0A5;
    --border-strong:#DCDAD4;
    --border:#E9E7E2;
    --divider:#EFEDE8;
    --spruce:#1F6B4E;
    --spruce-tint:#F4F8F5;
    --spruce-border:#DEE8E1;
    --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--surface);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:14px;line-height:1.5;min-height:100vh}
  body{display:flex;flex-direction:column}
  header{flex:none}
  main{flex:1 0 auto}
  a{color:inherit;text-decoration:none}
  button{background:none;border:none;font:inherit;color:inherit;cursor:pointer;padding:0;text-align:left}

  /* ---- sticky header ---- */
  header{background:var(--surface-warm);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .header-inner{padding:18px 20px 16px}
  h1.title{font:600 24px/1.15 var(--sans);letter-spacing:-.02em;color:var(--ink)}

  .search-wrap{margin-top:14px}
  .search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;transition:border-color .12s,box-shadow .12s}
  .search:focus-within{border-color:var(--spruce);border-width:1.5px;box-shadow:0 0 0 3px rgba(31,107,78,.12)}
  .mag{position:relative;width:13px;height:13px;border:1.5px solid var(--mono-mute);border-radius:50%;flex:none}
  .mag::after{content:"";position:absolute;right:-5px;bottom:-4px;width:6px;height:1.5px;background:var(--mono-mute);transform:rotate(45deg)}
  .search:focus-within .mag{border-color:var(--spruce)}
  .search:focus-within .mag::after{background:var(--spruce)}
  .search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font:400 14px/1 var(--mono);color:var(--ink)}
  .search input::placeholder{color:var(--placeholder)}

  .status-line{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:14px;font:400 11px/1 var(--mono);letter-spacing:.04em;color:var(--mono-mute);text-transform:uppercase}

  /* ---- main list (row backgrounds span full width) ---- */
  main{background:var(--surface);border-top:1px solid var(--border);min-height:60vh}

  .register-head{display:none}

  /* ---- row (mobile) ---- */
  .stack{border-bottom:1px solid var(--divider);background:var(--surface)}
  .stack.open{background:var(--surface-soft)}
  .row{
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:
      "name purity"
      "name status";
    column-gap:14px;
    row-gap:6px;
    align-items:center;
    padding:15px 18px;
    width:100%;
    cursor:pointer;
    transition:background .1s;
  }
  .row:hover{background:var(--surface-soft)}
  .stack.open > .row{background:var(--surface-soft)}
  .cell-name{grid-area:name;align-self:center;font:500 16px/1.25 var(--sans);color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell-purity{grid-area:purity;justify-self:end;font:500 15px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
  .cell-status{grid-area:status;justify-self:end}
  .cell-lab,.cell-date{display:none}
  .pass{display:inline-flex;align-items:center;gap:5px}
  .pass::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--spruce)}
  .pass-label{font:500 10.5px/1 var(--mono);letter-spacing:.13em;color:var(--spruce);text-transform:uppercase}

  /* ---- row expand (mobile) ---- */
  .expand{display:none;padding:0 18px 18px}
  .stack.open > .expand{display:block}
  .data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:14px 0 0;border-top:1px solid var(--border)}
  .data-grid .span-2{grid-column:1/-1}
  .field-label{font:400 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--mono-mute);text-transform:uppercase}
  .field-value{margin-top:5px;font:500 13px/1.35 var(--mono);color:var(--ink);word-break:break-all}
  .field-value.sans{font-family:var(--sans);font-weight:400}
  .open-coa{display:flex;align-items:center;justify-content:center;height:44px;margin-top:16px;background:var(--ink);border-radius:7px;font:500 13px/1 var(--mono);letter-spacing:.06em;color:var(--surface-warm);text-transform:uppercase;transition:opacity .12s;text-decoration:none}
  .open-coa:hover{opacity:.9}
  .history-heading{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font:400 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--mono-mute);text-transform:uppercase}
  .history-list{margin-top:8px;display:flex;flex-direction:column}
  .h-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--divider);text-decoration:none;color:inherit}
  .h-item:first-child{border-top:none}
  .h-item-lot{font:400 12px/1.4 var(--mono);color:var(--ink-2)}
  .h-item:hover .h-item-lot{color:var(--ink)}
  .h-item-purity{font:500 11px/1 var(--mono);color:var(--spruce);flex:none}
  .h-item-pdf{display:none}

  /* ---- desktop register (>= 900px) ---- */
  @media (min-width:900px){
    .header-inner{padding:34px 40px 26px;display:grid;grid-template-columns:1fr 420px;gap:48px;align-items:end}
    h1.title{margin-top:0;font-size:34px;line-height:1.1;letter-spacing:-.025em}
    .search-wrap{margin-top:0}
    .search{height:50px}

    .register-head{
      display:grid;
      grid-template-columns:minmax(0,2.4fr) 1fr 1.3fr 1fr 110px;
      gap:24px;padding:13px 40px;
      border-bottom:1px solid var(--border);background:var(--surface-soft);
      font:400 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--mono-mute);text-transform:uppercase;
    }
    .register-head .right{text-align:right}

    .row{
      grid-template-columns:minmax(0,2.4fr) 1fr 1.3fr 1fr 110px;
      grid-template-areas:"name purity lab date status";
      column-gap:24px;row-gap:0;
      padding:17px 40px;
    }
    .cell-name{font-size:15px;white-space:normal;overflow:visible;text-overflow:clip}
    .cell-purity{justify-self:start;font-size:14px}
    .cell-lab{display:block;font:400 13px/1.3 var(--sans);color:var(--ink-2)}
    .cell-date{display:block;font:400 12.5px/1 var(--mono);color:var(--ink-2)}
    .stack:not(.open):nth-child(even) > .row{background:var(--surface-soft)}

    /* desktop expansion: two-column panel below the row */
    .expand{padding:0 40px 22px;background:var(--surface-soft);border-bottom:1px solid var(--divider)}
    .stack.open{background:var(--surface-soft)}
    .mobile-only{display:none}
    .desktop-expand{display:grid;grid-template-columns:1fr 300px;gap:40px;padding-top:4px}
    .desktop-expand .side .side-label{font:400 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--mono-mute);text-transform:uppercase}
    .desktop-expand .side .side-value{margin-top:9px;font:500 13px/1.35 var(--mono);word-break:break-all}
    .history-heading{border-top:none;margin-top:0;padding-top:0}
    .h-item{display:grid;grid-template-columns:1fr 1.4fr .6fr 1fr;gap:20px}
    .h-item-lot{font-size:12.5px;color:var(--ink-2)}
    .h-lot-date{color:var(--ink-2)}
    .h-item-purity{color:var(--ink-2)}
    .h-item-pdf{display:inline;font:400 12.5px/1 var(--mono);color:var(--spruce)}
    .open-coa{height:42px;margin-top:16px}
  }

  @media (max-width:899px){
    .desktop-expand{display:block}
    .desktop-expand .side{display:none}
  }

  /* ---- states ---- */
  .empty,.loading{padding:60px 24px;text-align:center;color:var(--ink-3);font:400 13.5px/1.7 var(--sans)}
  .empty code{font:500 12px/1 var(--mono);background:var(--surface-mute);padding:2px 6px;border-radius:4px;border:1px solid var(--border)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--spruce);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{max-width:1280px;margin:0 auto;padding:22px 20px 40px;font:400 11.5px/1.7 var(--sans);color:var(--ink-3);text-align:center}
  footer a{color:var(--ink-2)}
  footer a:hover{color:var(--spruce)}

  .none{display:none !important}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1 class="title">TIDELwave</h1>
    </div>
    <div class="search-wrap">
      <div class="search">
        <span class="mag" aria-hidden="true"></span>
        <input id="q" type="text" placeholder="Peptide name" oninput="filter()" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>
</header>

<main>
  <div class="register-head none">
    <span>Peptide</span>
    <span>Purity</span>
    <span>Testing lab</span>
    <span>COA date</span>
    <span class="right">Status</span>
  </div>
  <div id="loading" class="loading"><span class="spinner"></span>Loading lab reports…</div>
  <div id="list"></div>
  <div id="empty" class="empty none"></div>
</main>


<script>
/* Data source: pdf/manifest.json (see pdf/README.md for schema).
   Each peptide stack has a slug matching its folder and an ordered
   batches[] array, newest first. Rows are one per stack that has a
   COA; empty stacks are hidden. Row tap expands in place with the
   full metadata + open-COA button + older-batch history. Search
   filters by peptide name or lot without auto-expanding matches. */

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function batchSlug(file){return String(file).replace(/\.pdf$/i,"")}
function batchUrl(peptide, batch){
  return "/pdf/" + encodeURIComponent(peptide.slug) + "/" + encodeURIComponent(batchSlug(batch.file));
}
function formatDate(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  return m ? (m[1]+"-"+m[2]+"-"+m[3]) : String(iso);
}

function historyItemsHTML(peptide){
  if(peptide.batches.length < 2) return "";
  var older = peptide.batches.slice(1);
  var items = older.map(function(b){
    return '<a class="h-item" href="'+batchUrl(peptide,b)+'" target="_blank" rel="noopener" data-lot="'+esc((b.lot||"").toLowerCase())+'">'
      + '<span class="h-item-lot"><span class="h-lot-date">'+esc(formatDate(b.date))+'</span> &middot; '+esc(b.lot || batchSlug(b.file))+'</span>'
      + '<span class="h-item-purity">'+esc(b.purity)+'</span>'
      + '<span class="h-item-pdf">PASS &middot; PDF &#8599;</span>'
    + '</a>';
  }).join("");
  return '<div class="history-heading">Batch history</div><div class="history-list">'+items+'</div>';
}

function stackHTML(peptide){
  var b = peptide.batches[0];
  var url = batchUrl(peptide, b);
  var blob = (peptide.product+" "+(b.lab||"")).toLowerCase();

  /* Mobile expansion: full metadata grid + open COA button + history */
  var mobileGrid =
      '<div class="data-grid">'
        + (b.lot?'<div class="span-2"><div class="field-label">Lot on your vial</div><div class="field-value">'+esc(b.lot)+'</div></div>':'')
        + '<div><div class="field-label">COA date</div><div class="field-value">'+esc(formatDate(b.date))+'</div></div>'
        + '<div><div class="field-label">Purity</div><div class="field-value">'+esc(b.purity)+'</div></div>'
        + (b.lab?'<div><div class="field-label">Testing lab</div><div class="field-value sans">'+esc(b.lab)+'</div></div>':'')
        + (b.reference?'<div><div class="field-label">Lab reference</div><div class="field-value">'+esc(b.reference)+'</div></div>':'')
      + '</div>'
      + '<a class="open-coa" href="'+url+'" target="_blank" rel="noopener">Open full COA &rarr;</a>';

  /* Desktop expansion: two-column panel (history + reference/button on right) */
  var desktopSide =
      '<div class="side">'
        + (b.reference?'<div class="side-label">Lab reference</div><div class="side-value">'+esc(b.reference)+'</div>':'')
        + '<a class="open-coa" href="'+url+'" target="_blank" rel="noopener">Open full COA &rarr;</a>'
      + '</div>';

  return '<div class="stack" data-name="'+esc(blob)+'" data-slug="'+esc(peptide.slug)+'">'
    + '<button class="row" onclick="toggleStack(this)" aria-expanded="false">'
      + '<span class="cell-name">'+esc(peptide.product)+'</span>'
      + '<span class="cell-purity">'+esc(b.purity)+'</span>'
      + '<span class="cell-lab">'+esc(b.lab || "&mdash;")+'</span>'
      + '<span class="cell-date">'+esc(formatDate(b.date))+'</span>'
      + '<span class="cell-status"><span class="pass"><span class="pass-label">PASS</span></span></span>'
    + '</button>'
    + '<div class="expand">'
      + '<div class="mobile-only">' + mobileGrid + '</div>'
      + '<div class="desktop-expand">'
        + '<div class="main">' + historyItemsHTML(peptide) + '</div>'
        + desktopSide
      + '</div>'
    + '</div>'
  + '</div>';
}

function toggleStack(rowBtn){
  var stack = rowBtn.closest(".stack");
  var open = stack.classList.toggle("open");
  rowBtn.setAttribute("aria-expanded", open ? "true" : "false");
}

function render(peptides){
  document.getElementById("loading").classList.add("none");
  var withBatches = (peptides||[])
    .filter(function(p){return p.batches && p.batches.length})
    .sort(function(a,b){return a.product.localeCompare(b.product)});
  document.getElementById("list").innerHTML = withBatches.map(stackHTML).join("");

  if(withBatches.length){
    document.querySelector(".register-head").classList.remove("none");
  }

  if(!withBatches.length){
    document.getElementById("empty").innerHTML = "No certificates published yet.";
    document.getElementById("empty").classList.remove("none");
  }
}

function filter(){
  var q = document.getElementById('q').value.toLowerCase().trim();
  var rows = document.querySelectorAll('#list .stack');
  var shown = 0;
  rows.forEach(function(r){
    var name = r.dataset.name;
    var hit = !q || name.indexOf(q) > -1;
    r.classList.toggle('none', !hit);
    if(hit) shown++;
  });
  var empty = document.getElementById('empty');
  if(rows.length && shown === 0){
    empty.innerHTML = q ? 'No results for &ldquo;'+esc(q)+'&rdquo;.' : 'No certificates published yet.';
    empty.classList.remove('none');
  } else {
    empty.classList.add('none');
  }
}

function init(){
  fetch("pdf/manifest.json", {cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("manifest "+r.status); return r.json(); })
    .then(function(peptides){ render(peptides || []); })
    .catch(function(){
      document.getElementById("loading").classList.add("none");
      document.getElementById("empty").innerHTML =
        "Couldn't load <code>pdf/manifest.json</code>. If you opened this file directly, serve the folder with <code>python3 serve.py</code> instead.";
      document.getElementById("empty").classList.remove("none");
    });
}

init();
</script>
</body>
</html>
