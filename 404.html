<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate of Analysis — TIDElwave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#EFEEEA;
    --surface:#FFFFFF;
    --surface-warm:#FBFAF8;
    --surface-mute:#F4F3F0;
    --ink:#23272B;
    --ink-2:#5C6469;
    --ink-3:#6E767B;
    --ink-4:#7E888E;
    --mono-mute:#8A9096;
    --placeholder:#9AA0A5;
    --border-strong:#DCDAD4;
    --border:#E9E7E2;
    --divider:#EFEDE8;
    --spruce:#1F6B4E;
    --spruce-tint:#F4F8F5;
    --spruce-border:#DEE8E1;
    --warn-bg:#FBF3E4;
    --warn-border:#EADCC0;
    --warn-tag-border:#B98A2E;
    --warn-tag-ink:#8A5A12;
    --warn-ink:#6B4A11;
    --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--surface-warm);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;min-height:100vh}
  a{color:inherit;text-decoration:none}

  /* ---- slim header ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid var(--border);background:var(--surface-warm);position:sticky;top:0;z-index:10}
  .back{font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase;transition:color .12s}
  .back:hover{color:var(--ink)}
  .batch-count{font:400 11px/1 var(--mono);letter-spacing:.06em;color:var(--mono-mute);text-transform:uppercase}

  /* ---- archived warning banner ---- */
  .warn{display:none;background:var(--warn-bg);border-bottom:1px solid var(--warn-border);padding:14px 18px}
  .warn.on{display:block}
  .warn-inner{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;justify-content:space-between;max-width:1280px;margin:0 auto}
  .warn-msg{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .warn-tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border:1px solid var(--warn-tag-border);border-radius:3px;font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--warn-tag-ink);text-transform:uppercase;flex:none}
  .warn-text{font:400 13px/1.5 var(--sans);color:var(--warn-ink)}
  .warn-cta{font:500 12px/1 var(--mono);letter-spacing:.05em;color:var(--warn-tag-ink);text-transform:uppercase;flex:none}
  .warn-cta:hover{color:var(--ink)}

  /* ---- viewer wrap ---- */
  #viewer{display:none}
  #viewer.on{display:block}

  main{background:var(--surface);max-width:1280px;margin:0 auto}

  /* ---- info sidebar (mobile: stacked; desktop: 392px column) ---- */
  .info{padding:18px}
  .info-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .pname{font:600 20px/1.2 var(--sans);letter-spacing:-.01em;color:var(--ink)}
  .pass{display:inline-flex;align-items:center;gap:5px;flex:none}
  .pass::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--spruce)}
  .pass-label{font:500 10.5px/1 var(--mono);letter-spacing:.13em;color:var(--spruce);text-transform:uppercase}

  .purity-hero{display:none} /* only appears on desktop */
  .purity-num{font:500 42px/.9 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .purity-unit{font:400 15px/1 var(--mono);color:var(--ink-2);padding-bottom:3px}

  .data-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .data-grid .span-2{grid-column:1/-1}
  .field-label{font:400 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--mono-mute);text-transform:uppercase}
  .field-value{margin-top:5px;font:500 13px/1.35 var(--mono);color:var(--ink);word-break:break-all}
  .field-value.sans{font-family:var(--sans);font-weight:400}

  .history{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .history-label{font:400 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--mono-mute);text-transform:uppercase}
  .chips{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;height:32px;padding:0 11px;border:1px solid var(--border-strong);border-radius:6px;font:400 11.5px/1 var(--mono);color:var(--ink-2);text-decoration:none;transition:border-color .12s,color .12s}
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip.viewing{background:var(--ink);border-color:var(--ink);color:var(--surface-warm);font-weight:500;gap:14px}
  .chip.viewing:hover{color:var(--surface-warm);opacity:.9}
  .chip-download{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--surface-warm);opacity:.8}
  .chip.viewing:hover .chip-download{opacity:1}

  /* ---- pdf area ---- */
  .pdf-wrap{background:var(--surface-mute);padding:14px 18px 0;border-top:1px solid var(--border)}
  .pdf-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;font:400 10px/1 var(--mono);letter-spacing:.12em;color:var(--mono-mute);text-transform:uppercase}
  .dl-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;background:var(--ink);color:var(--surface-warm);border-radius:6px;font:500 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:opacity .12s,background .12s}
  .dl-btn:hover{background:var(--spruce);color:#fff}
  .dl-btn span{font-size:14px;line-height:1}
  .pdf-body{margin-top:12px;background:var(--surface);border:1px solid var(--border-strong);border-bottom:none;border-radius:6px 6px 0 0;min-height:280px;padding:14px;padding-bottom:32px}
  .pdf-body canvas{display:block;width:100%;height:auto;margin:0 auto 14px;border:1px solid var(--divider);border-radius:2px}
  .pdf-msg{padding:60px 20px;text-align:center;font:400 12.5px/1.7 var(--mono);letter-spacing:.08em;color:var(--placeholder);text-transform:uppercase}
  .pdf-msg a{color:var(--spruce);text-transform:none;letter-spacing:0}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--spruce);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- desktop layout ---- */
  @media (min-width:900px){
    .topbar{padding:14px 40px 12px}
    .topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;width:100%}
    .warn{padding:14px 40px}
    main{display:grid;grid-template-columns:392px 1fr;min-height:calc(100vh - 48px)}
    .info{padding:32px 32px 32px 48px;border-right:1px solid var(--border);overflow:hidden}
    .info-head{align-items:baseline}
    .pname{font-size:26px;letter-spacing:-.02em}
    .pass-label-verified::before{content:"PASS · VERIFIED BATCH"}
    .pass-label-archived::before{content:"PASS · ARCHIVED BATCH"}
    .pass-desktop{margin-top:14px;display:flex;align-items:center;gap:7px}
    .pass-desktop::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--spruce)}
    .pass-desktop-label{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--spruce);text-transform:uppercase}
    .pass{display:none} /* replaced by .pass-desktop under name */
    .purity-hero{display:flex;align-items:flex-end;gap:9px;margin-top:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
    .data-grid{margin-top:20px;padding-top:0;border-top:none;gap:18px 20px}
    .history{margin-top:26px;padding-top:18px}
    .chips{flex-direction:column;gap:7px}
    .chip{display:flex;justify-content:space-between;height:40px;padding:0 13px;font-size:12.5px}
    .chip .chip-right{color:var(--spruce);font-weight:500}
    .chip.viewing .chip-right{color:var(--surface-warm)}
    .pdf-wrap{padding:26px 48px 0;border-top:none;border-left:0}
    .pdf-body{min-height:calc(100vh - 200px);padding:24px}
    /* pdf.js canvases render at 720px max on desktop for readability */
  }

  /* ---- not found ---- */
  #notfound{display:none;max-width:520px;margin:80px auto;text-align:center;padding:40px 24px}
  #notfound.on{display:block}
  #notfound h1{font:600 32px/1.15 var(--sans);letter-spacing:-.02em;color:var(--ink);margin-bottom:12px}
  #notfound p{font:400 14px/1.7 var(--sans);color:var(--ink-2);margin-bottom:24px}
  #notfound a.home{display:inline-flex;align-items:center;height:44px;padding:0 22px;background:var(--ink);border-radius:7px;font:500 12.5px/1 var(--mono);letter-spacing:.06em;color:var(--surface-warm);text-transform:uppercase}
  #notfound a.home:hover{opacity:.9}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="back" href="/">&larr; Library</a>
    <span id="batchCount" class="batch-count"></span>
  </div>
</div>

<div id="warn" class="warn">
  <div class="warn-inner">
    <div class="warn-msg">
      <span class="warn-tag">Archived</span>
      <span id="warnText" class="warn-text"></span>
    </div>
    <a id="warnCta" class="warn-cta" href="#">View current batch &rarr;</a>
  </div>
</div>

<div id="viewer">
  <main>
    <div class="info">
      <div class="info-head">
        <div class="pname" id="pname"></div>
        <span class="pass"><span class="pass-label">PASS</span></span>
      </div>
      <div id="passDesktop" class="pass-desktop"><span class="pass-desktop-label pass-label-verified"></span></div>
      <div class="purity-hero">
        <span class="purity-num" id="purityNum"></span>
        <span class="purity-unit">% purity</span>
      </div>
      <div class="data-grid" id="dataGrid"></div>
      <div id="historyBlock" class="history">
        <div class="history-label">Batch history</div>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <div class="pdf-wrap">
      <div class="pdf-toolbar">
        <span id="pdfLabel">Certificate</span>
        <a id="downloadLink" class="dl-btn" href="#" download>Download PDF <span aria-hidden="true">&darr;</span></a>
      </div>
      <div class="pdf-body" id="pdfBody"><div class="pdf-msg"><span class="spinner"></span>Loading certificate&hellip;</div></div>
    </div>
  </main>
</div>

<div id="notfound">
  <h1>Not found</h1>
  <p id="notfoundMsg">This page doesn&rsquo;t exist.</p>
  <a class="home" href="/">Return to the library</a>
</div>

<script>
/* Dedicated PDF route. GitHub Pages serves this file for any path
   it can't otherwise resolve. When the path is
   /pdf/<peptide>/<batch>, we render that batch's viewer: metadata
   card + PDF rendered inline with pdf.js + chip list of every
   batch for the stack. Viewing a non-current batch surfaces an
   amber "archived" banner. Anything else renders a real 404. */

var PDFJS_VERSION = "3.11.174";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function formatDate(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  return m ? (m[1]+"-"+m[2]+"-"+m[3]) : String(iso);
}
function batchSlug(file){return String(file).replace(/\.pdf$/i,"")}
function batchUrl(peptide, batch){
  return "/pdf/" + encodeURIComponent(peptide.slug) + "/" + encodeURIComponent(batchSlug(batch.file));
}

function showNotFound(msg){
  if(msg) document.getElementById("notfoundMsg").textContent = msg;
  document.getElementById("viewer").classList.remove("on");
  document.getElementById("notfound").classList.add("on");
}

function renderInfo(peptide, batch){
  document.getElementById("pname").textContent = peptide.product;
  document.getElementById("purityNum").textContent = String(batch.purity).replace(/%$/, "");

  /* lot stays in the manifest as data but is not displayed on the viewer */
  var g = "";
  g += '<div><div class="field-label">Purity</div><div class="field-value">'+esc(batch.purity)+'</div></div>';
  g += '<div><div class="field-label">COA date</div><div class="field-value">'+esc(formatDate(batch.date))+'</div></div>';
  if(batch.lab){
    g += '<div><div class="field-label">Testing lab</div><div class="field-value sans">'+esc(batch.lab)+'</div></div>';
  }
  if(batch.reference){
    g += '<div><div class="field-label">Lab reference</div><div class="field-value">'+esc(batch.reference)+'</div></div>';
  }
  document.getElementById("dataGrid").innerHTML = g;
}

function renderChips(peptide, batch){
  var chips = peptide.batches.map(function(b){
    var isViewing = b.file === batch.file;
    var isCurrent = peptide.batches[0].file === b.file;
    var tag = isViewing && isCurrent ? " · Current"
            : isViewing              ? " · Viewing"
            : isCurrent              ? " · Current"
            : "";
    return '<a class="chip'+(isViewing?' viewing':'')+'" href="'+batchUrl(peptide,b)+'">'
      + '<span class="chip-left">'+esc(formatDate(b.date))+tag+'</span>'
      + (isViewing?'':'<span class="chip-right">'+esc(b.purity)+'</span>')
    + '</a>';
  }).join("");
  document.getElementById("chips").innerHTML = chips;
  document.getElementById("batchCount").textContent =
    "Batch " + (peptide.batches.findIndex(function(b){return b.file===batch.file})+1) + " of " + peptide.batches.length;
}

function renderWarn(peptide, batch){
  var isCurrent = peptide.batches[0].file === batch.file;
  var warn = document.getElementById("warn");
  var passLabel = document.querySelector(".pass-desktop-label");
  if(isCurrent){
    warn.classList.remove("on");
    if(passLabel){ passLabel.classList.add("pass-label-verified"); passLabel.classList.remove("pass-label-archived"); }
    return;
  }
  warn.classList.add("on");
  var current = peptide.batches[0];
  document.getElementById("warnText").textContent =
    "You are viewing a superseded batch. The current batch for " + peptide.product +
    " is lot " + (current.lot || batchSlug(current.file)) + ", dated " + formatDate(current.date) + ".";
  document.getElementById("warnCta").setAttribute("href", batchUrl(peptide, current));
  if(passLabel){ passLabel.classList.add("pass-label-archived"); passLabel.classList.remove("pass-label-verified"); }
}

function renderPdf(pdfUrl){
  var body = document.getElementById("pdfBody");
  var pdfjsReady = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/pdf.min.js";
    s.onload = function(){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/pdf.worker.min.js";
      res(window.pdfjsLib);
    };
    s.onerror = rej;
    document.head.appendChild(s);
  });
  pdfjsReady.then(function(pdfjs){
    return pdfjs.getDocument({url: pdfUrl}).promise;
  }).then(function(pdf){
    document.getElementById("pdfLabel").textContent =
      "Certificate — " + pdf.numPages + " page" + (pdf.numPages===1?"":"s");
    body.innerHTML = "";
    var width = Math.min(body.clientWidth || 720, 720);
    var chain = Promise.resolve();
    for(let n = 1; n <= pdf.numPages; n++){
      chain = chain.then(function(){ return pdf.getPage(n); }).then(function(page){
        var scale = width / page.getViewport({scale:1}).width;
        var vp = page.getViewport({scale: scale * (window.devicePixelRatio || 1)});
        var c = document.createElement("canvas");
        c.width = vp.width; c.height = vp.height;
        body.appendChild(c);
        return page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
      });
    }
    return chain;
  }).catch(function(){
    body.innerHTML = '<div class="pdf-msg">PDF failed to render.<br><a href="'+esc(pdfUrl)+'" target="_blank" rel="noopener">Open it directly &rarr;</a></div>';
  });
}

function init(){
  var m = /^\/pdf\/([^\/]+)\/([^\/]+)\/?$/.exec(location.pathname);
  if(!m){ showNotFound(); return; }
  var peptideSlug = decodeURIComponent(m[1]);
  var batchSlugStr = decodeURIComponent(m[2]);

  fetch("/pdf/manifest.json", {cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("manifest "+r.status); return r.json(); })
    .then(function(peptides){
      var peptide = (peptides||[]).find(function(p){return p.slug === peptideSlug});
      if(!peptide){ showNotFound("No peptide stack found for “"+peptideSlug+"”."); return; }
      var batch = peptide.batches.find(function(b){return batchSlug(b.file) === batchSlugStr});
      if(!batch){ showNotFound("No batch “"+batchSlugStr+"” on file for "+peptide.product+"."); return; }

      var pdfUrl = "/pdf/" + encodeURIComponent(peptide.slug) + "/" + encodeURIComponent(batch.file);
      document.title = peptide.product + " · Lot " + (batch.lot || batchSlug(batch.file)) + " — TIDElwave";
      document.getElementById("downloadLink").setAttribute("href", pdfUrl);
      renderInfo(peptide, batch);
      renderChips(peptide, batch);
      renderWarn(peptide, batch);
      document.getElementById("viewer").classList.add("on");
      renderPdf(pdfUrl);
    })
    .catch(function(){
      showNotFound("Couldn't load the certificate catalog.");
    });
}

init();
</script>
</body>
</html>
