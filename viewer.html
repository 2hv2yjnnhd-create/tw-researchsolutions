<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate of Analysis — TIDELWAVE</title>
<style>
  :root{
    --tw-ink-900:#05070c; --tw-ink-800:#0a0e16; --tw-ink-700:#111722; --tw-ink-500:#262f41;
    --tw-chrome-100:#f4f8fc; --tw-chrome-200:#dde5ee; --tw-chrome-300:#bcc7d4; --tw-chrome-500:#6d7b8c;
    --tw-blue-300:#7fb6ff; --tw-blue-400:#3d92ff; --tw-blue-500:#0a6be1; --tw-warn:#e0a13c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",system-ui,sans-serif;background:var(--tw-ink-800);color:var(--tw-chrome-200);-webkit-font-smoothing:antialiased;min-height:100vh}
  .navbar{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 20px;background:var(--tw-ink-900);border-bottom:1px solid var(--tw-ink-500)}
  .brand{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:var(--tw-chrome-100)}
  .brand span{color:var(--tw-blue-400)}
  .back{color:var(--tw-blue-300);text-decoration:none;font-size:13.5px}
  .back:hover{color:var(--tw-blue-400)}
  main{max-width:720px;margin:0 auto;padding:24px 16px 60px}
  .doc-close{display:flex;justify-content:space-between;align-items:center;background:var(--tw-ink-900);color:var(--tw-chrome-100);padding:11px 16px;font-size:13px;gap:10px;border:1px solid var(--tw-ink-500);border-bottom:none;border-radius:8px 8px 0 0}
  .doc-close b{font-weight:500;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-close a{color:var(--tw-blue-300);text-decoration:none;font-size:12.5px;flex:none}
  .doc-close a:hover{color:var(--tw-blue-400)}
  .pdf-body{padding:16px;background:var(--tw-ink-700);border:1px solid var(--tw-ink-500);border-radius:0 0 8px 8px;min-height:300px}
  .pdf-body canvas{display:block;width:100%;height:auto;margin:0 auto 12px;box-shadow:0 2px 14px rgba(0,0,0,.5);border-radius:2px}
  .pdf-msg{color:var(--tw-chrome-300);text-align:center;font-size:14px;padding:60px 20px;line-height:1.8}
  .pdf-msg a{color:var(--tw-blue-300)}
  .demo-fixture{text-align:left;max-width:480px;margin:20px auto;padding:20px 22px;border:1px solid var(--tw-ink-500);border-radius:8px;background:var(--tw-ink-800)}
  .demo-fixture .tag{display:inline-block;font-family:"Saira Condensed","Arial Narrow",sans-serif;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tw-warn);border:1px solid var(--tw-ink-500);border-radius:4px;padding:4px 10px;margin-bottom:12px}
  .demo-fixture p{font-size:13.5px;line-height:1.7;color:var(--tw-chrome-300)}
  .demo-fixture code{font-family:ui-monospace,"SF Mono",monospace;font-size:12.5px;background:var(--tw-ink-700);border:1px solid var(--tw-ink-500);border-radius:3px;padding:1px 5px;color:var(--tw-chrome-100)}
  .spinner{display:inline-block;width:22px;height:22px;border:3px solid var(--tw-ink-500);border-top-color:var(--tw-blue-500);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:10px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="navbar">
  <div class="brand">TIDE<span>lwave</span> RESEARCH</div>
  <a class="back" href="index.html">&larr; Back to library</a>
</div>
<main>
  <div class="doc-close">
    <b id="title">Certificate of Analysis</b>
    <a id="dl" href="#" target="_blank" rel="noopener">Open in Drive</a>
  </div>
  <div class="pdf-body" id="pdfBody"><div class="pdf-msg"><span class="spinner"></span> Loading certificate&hellip;</div></div>
</main>

<script src="config.js"></script>
<script>
/* API_KEY comes from config.js (shared with index.html) — see that file
   for what it means and how demo mode activates.
   Reads the file id straight off the URL: viewer.html?id={fileId}.
   id=DEMO is a reserved fixture id: index.html's demo mode links one
   sample card to viewer.html?id=DEMO so the new-tab path is exercised
   without needing a real API key — this page renders a placeholder for
   it instead of attempting a live Drive fetch. */

/* pdf.js pinned to a fixed version — never @latest, so this page can't
   break out from under us on a future pdf.js release. */
var PDFJS_VERSION = "3.11.174";

var params = new URLSearchParams(location.search);
var fileId = params.get("id");
var driveView = fileId ? "https://drive.google.com/file/d/" + fileId + "/view" : null;

var body = document.getElementById("pdfBody");
var dl = document.getElementById("dl");

if(!fileId){
  dl.remove();
  body.innerHTML = '<div class="pdf-msg">No certificate was specified.<br><a href="index.html">Return to the COA library &rarr;</a></div>';
}else if(fileId === "DEMO"){
  dl.remove();
  document.getElementById("title").textContent = "Demo Certificate — New-Tab Viewer";
  body.innerHTML = '<div class="demo-fixture"><span class="tag">Demo fixture</span>'
    + '<p>This is the exact page a real customer opens when they tap a live COA card — same URL shape, same new tab. There’s no real Drive file behind the id <code>DEMO</code>, so nothing renders below.</p>'
    + '<p>Once a real <code>API_KEY</code> is pasted into <code>config.js</code>, this same page renders the actual certificate PDF for any live <code>viewer.html?id={fileId}</code> link.</p></div>';
}else{
  dl.href = driveView;

  var pdfjsReady = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/pdf.min.js";
    s.onload = function(){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/pdf.worker.min.js";
      res(window.pdfjsLib);
    };
    s.onerror = rej;
    document.head.appendChild(s);
  });

  var mediaUrl = "https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media&key=" + API_KEY;

  pdfjsReady.then(function(pdfjs){
    return pdfjs.getDocument({url: mediaUrl}).promise;
  }).then(function(pdf){
    body.innerHTML = "";
    var width = Math.min(body.clientWidth || 680, 680);
    var chain = Promise.resolve();
    for(let n = 1; n <= pdf.numPages; n++){
      chain = chain.then(function(){ return pdf.getPage(n); }).then(function(page){
        var scale = width / page.getViewport({scale:1}).width;
        var vp = page.getViewport({scale: scale * (window.devicePixelRatio || 1)});
        var c = document.createElement("canvas");
        c.width = vp.width; c.height = vp.height;
        body.appendChild(c);
        return page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
      });
    }
    return chain;
  }).catch(function(){
    /* pdf.js failed to load, the key is invalid/placeholder, or the file
       isn't reachable — fall back to the raw Drive link, per spec. */
    body.innerHTML = '<div class="pdf-msg">Couldn’t display the certificate here.<br><a href="' + driveView + '" target="_blank" rel="noopener">Open the PDF directly →</a></div>';
  });
}
</script>
</body>
</html>
